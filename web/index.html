<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1318" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fenix">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Fenix Dash</title>
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Fenix Dash<small id="mode-tag"></small></div>
    <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
    <div class="tools">
      <div class="seg" id="range" role="group" aria-label="Date range"></div>
      <div class="seg" id="units" role="group" aria-label="Distance units"></div>
      <button class="sync" id="sync" type="button">Sync</button>
      <button class="sync" id="theme" type="button" aria-label="Switch light or dark theme">Theme</button>
      <button class="sync" id="signout" type="button" hidden>Sign out</button>
    </div>
  </div>
</header>
<main id="main" aria-live="polite"></main>
<script type="module" src="./app.js"></script>
</body>
</html>
